<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#3a090b">
  <title>Owner Review — ENS MBZ Museum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=editorial-19">
  <link rel="stylesheet" href="review.css?v=review-7">
</head>
<body class="review-page">
  <header class="review-top"><a href="/" class="wordmark"><img class="wordmark-icon" src="assets/ens-mbz-school-logo.jpg" alt=""> ENS MBZ FILES</a><a class="review-back" href="/">BACK TO MUSEUM ↗</a></header>
  <main class="review-main">
    <p class="eyebrow">PRIVATE MODERATION · OWNER ACCESS</p>
    <h1>OWNER DESK<span>.</span></h1>
    <p class="review-lede">Manage the museum and give each staff member only the controls they need.</p>
    <section id="reviewLogin" class="review-card">
      <h2>STAFF SIGN IN</h2>
      <p>Staff use the username and password created by the owner. The owner signs in with their email and password.</p>
      <form id="reviewLoginForm">
        <label for="reviewUsername">USERNAME / EMAIL</label>
        <input id="reviewUsername" type="text" autocomplete="username" required placeholder="Staff username or owner email">
        <label for="reviewPassword">PASSWORD</label>
        <input id="reviewPassword" type="password" autocomplete="current-password" minlength="8" required placeholder="Your password">
        <button class="review-primary" type="submit">SIGN IN</button>
        <button class="review-secondary review-create" id="reviewResetPassword" type="button">OWNER EMAIL PASSWORD RESET</button>
      </form>
      <p id="reviewAuthMessage" class="review-message" role="status"></p>
    </section>
    <section id="reviewQueue" hidden>
      <div class="review-queue-head"><h2>MODERATION INBOX</h2><div><button id="reviewRefresh" class="review-secondary" type="button">REFRESH</button><button id="reviewSignOut" class="review-secondary" type="button">SIGN OUT</button></div></div>
      <nav class="review-tabs" aria-label="Moderation sections">
        <button class="review-tab is-active" data-section="photos" type="button">PHOTOS</button>
        <button class="review-tab" data-section="archive" type="button">PHOTO ARCHIVE</button>
        <button class="review-tab" data-section="comments" type="button">COMMENTS</button>
        <button class="review-tab" data-section="reports" type="button">REPORTS</button>
        <button class="review-tab" data-section="takedowns" type="button">TAKEDOWNS</button>
        <button class="review-tab" data-section="chat" type="button">CHAT</button>
        <button class="review-tab" data-section="site" type="button">SITE</button>
        <button class="review-tab" data-section="ipdesk" type="button">IP DESK</button>
        <button class="review-tab" data-section="staff" type="button">STAFF DESK</button>
      </nav>
      <p id="reviewQueueMessage" class="review-message" role="status"></p>
      <div id="reviewItems" class="review-grid"></div>
    </section>
  </main>
  <script src="supabase-config.js?v=restore-c001185"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="review-app-archive.js?v=owner-private-ips-4"></script>
</body>
</html>
